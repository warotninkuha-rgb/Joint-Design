    <title>โปรแกรมคำนวณกำลังในข้อต่อ (Beam-Column Joint)</title>
    <!-- เพิ่ม Favicon แบบฝังด้วย SVG -->

    <!-- Tailwind CSS -->

    <script>
        Babel.registerPreset('react-classic', {
            presets: [
                [Babel.availablePresets['react'], { runtime: 'classic' }]
            ]
        });
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap');
        body {
            font-family: 'Sarabun', sans-serif;
            background-color: #f3f4f6;
            color: #1f2937;
        }
        .math-font {
            font-family: 'Times New Roman', Times, serif;
            font-style: italic;
        }
        
        /* ตั้งค่ากระดาษสำหรับการพิมพ์ A4 */
        @page {
            size: A4;
            margin: 1cm; /* ปรับลด margin ลงเล็กน้อยเพื่อให้หน้า 1 บรรจุข้อมูลได้ครบ */
        }

            .shadow-sm, .shadow-md, .shadow-lg {
                box-shadow: none !important;
            }
            input, select {
                border-color: #d1d5db !important;
            }
            /* บังคับขึ้นหน้าใหม่เวลาพิมพ์ */
            .print\:break-before-page {
                page-break-before: always !important;
                break-before: page !important;
            }
            /* ป้องกันกล่องย่อยถูกตัดขาดกลางหน้า */
            .print\:break-inside-avoid {
                page-break-inside: avoid !important;
                break-inside: avoid !important;
            }

            .print\:overflow-visible {

        }

<body>
    <div id="root"></div>

    <script type="text/babel" data-presets="react-classic,env">
        const { useState, useMemo } = React;

        // --- SVG Icons Components ---
        const IconCheck = () => (
            <svg className="w-5 h-5 text-green-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M5 13l4 4L19 7"></path>
            </svg>
        );
        const IconCross = () => (
            <svg className="w-5 h-5 text-red-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M6 18L18 6M6 6l12 12"></path>
            </svg>
        );
        const IconJoint = () => (
            <svg className="w-8 h-8 text-blue-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 8h16M4 16h16M8 4v16M16 4v16"></path>
            </svg>
        );

        // --- เพิ่ม Icon สำหรับปุ่ม Print ---
        const IconPrinter = () => (
            <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M17 17h2a2 2 0 002-2v-4a2 2 0 00-2-2H5a2 2 0 00-2 2v4a2 2 0 002 2h2m2 4h6a2 2 0 002-2v-4a2 2 0 00-2-2H9a2 2 0 00-2 2v4a2 2 0 002 2zm8-12V5a2 2 0 00-2-2H9a2 2 0 00-2 2v4h10z"></path>
            </svg>
        );

        const App = () => {
            // --- 1. Global States (Inputs) ---
            const [inputs, setInputs] = useState({
                // ข้อมูลทั่วไป
                memberName: '', // ชื่อ Member
                // วัสดุ
                fc: 240,       // ksc
                fy: 4000,      // ksc
                fyt: 2400,     // ksc (สำหรับเหล็กปลอก)
                
                // ขนาดหน้าตัดเสา
                // colDepth = h  = ด้านเสาที่ "ขนาน" ทิศทางแรงเฉือนที่พิจารณา (= ความลึกข้อต่อ)
                // colWidth = bc = ด้านเสาที่ "ตั้งฉาก" ทิศทางแรงเฉือนที่พิจารณา
                colWidth: 20,  // cm (bc)
                colDepth: 20,  // cm (h)

                // ขนาดคานที่เข้ามาบรรจบที่ข้อต่อ (w = ความกว้างคาน, d = ความลึกคาน)
                // x1, x2 = คานในทิศทางแรงเฉือน (สร้างแรงเฉือนในข้อต่อ)
                // y1, y2 = คานตั้งฉากทิศทางแรงเฉือน (คานขวาง)
                beams: {
                    x1: { on: true, w: 20, d: 40 },
                    x2: { on: true, w: 20, d: 40 },
                    y1: { on: true, w: 20, d: 40 },
                    y2: { on: true, w: 20, d: 40 }
                },
                beamEcc: 0,        // cm, ระยะเยื้องศูนย์คานทิศทางแรงเฉือนเทียบกับแกนเสา
                ajMethod: 'fig',   // 'fig' = ตามรูปที่ 5.2-7 | 'full' = bc x h (แบบเดิม)
                c1Mode: 'max',     // 'max' | 'h' | 'b'

                // แรงและเหล็กเสริม
                topRebars: [{ id: 1, count: 2, size: 12 }], // เหล็กบน (รองรับหลายชั้น)
                botRebars: [{ id: 2, count: 2, size: 12 }], // เหล็กล่าง (รองรับหลายชั้น)
                vCol: 0,      // Ton (แรงเฉือนในเสา)
                
                // เหล็กปลอกในข้อต่อ
                tieSize: 6,    // mm
                tieLegs: 2,    // จำนวนขา
                tieSpacing: 10 // cm
            });

            const [activeTab, setActiveTab] = useState('summary');

            // --- Calculations ---
            const results = useMemo(() => {
                const { fc, fy, fyt, colWidth, colDepth, beams, beamEcc, ajMethod, c1Mode,
                        topRebars, botRebars, vCol, tieSize, tieLegs, tieSpacing } = inputs;

                // ตัวคูณลดกำลัง (Phi) สำหรับแรงเฉือน [ข้อ 5.2.7.5.1]
                const phi = 0.85;

                // คำนวณพื้นที่หน้าตัดเหล็ก (As1, As2) จากทุกชั้น
                const calculateArea = (rebars) => rebars.reduce((sum, r) => sum + r.count * (Math.PI * Math.pow((r.size / 10) / 2, 2)), 0);
                const as1 = calculateArea(topRebars); // cm2
                const as2 = calculateArea(botRebars); // cm2

                // =====================================================================
                // 0. การจำแนกประเภทข้อต่อจากขนาดคาน [ข้อ 5.2.7.5.3 ย่อหน้าท้าย]
                //    "จะถือว่าข้อต่อได้รับการยึดรัดจากคานก็ต่อเมื่อคานที่เข้ามายึดรัดนั้น
                //     (1) มีความกว้างไม่น้อยกว่า 3/4 ของความกว้างเสาด้านที่คานเข้ามาบรรจบ และ
                //     (2) มีความลึกไม่น้อยกว่า 3/4 ของความลึกคานตัวที่ลึกที่สุดที่เข้ามาบรรจบที่ข้อต่อ"
                // =====================================================================
                const hJoint = colDepth;   // ด้านเสาขนานทิศแรงเฉือน = ความลึกข้อต่อ (h)
                const cPerp  = colWidth;   // ด้านเสาตั้งฉากทิศแรงเฉือน (bc)

                const faceDefs = [
                    { key: 'x1', axis: 'X', label: 'คานด้าน X+', note: 'ขนานทิศแรงเฉือน' },
                    { key: 'x2', axis: 'X', label: 'คานด้าน X−', note: 'ขนานทิศแรงเฉือน' },
                    { key: 'y1', axis: 'Y', label: 'คานด้าน Y+', note: 'คานขวาง (ตั้งฉาก)' },
                    { key: 'y2', axis: 'Y', label: 'คานด้าน Y−', note: 'คานขวาง (ตั้งฉาก)' }
                ];

                // ความลึกคานที่ลึกที่สุดที่เข้ามาบรรจบที่ข้อต่อ
                const maxBeamDepth = faceDefs.reduce((m, f) => (beams[f.key].on ? Math.max(m, beams[f.key].d) : m), 0);
                const reqDepth = 0.75 * maxBeamDepth;

                const TOL = 1e-9;
                const faceResults = faceDefs.map(f => {
                    const b = beams[f.key];
                    // ความกว้างเสา "ด้านที่คานเข้ามาบรรจบ"
                    //  - คานแกน X ชนหน้าเสาที่มีความกว้าง = ด้านเสาตั้งฉากแกน X = bc
                    //  - คานแกน Y ชนหน้าเสาที่มีความกว้าง = ด้านเสาตั้งฉากแกน Y = h
                    const colFaceWidth = f.axis === 'X' ? cPerp : hJoint;
                    const reqWidth = 0.75 * colFaceWidth;
                    const okW = b.on && (b.w >= reqWidth - TOL);
                    const okD = b.on && (b.d >= reqDepth - TOL);
                    return {
                        ...f, on: b.on, w: b.w, d: b.d,
                        colFaceWidth, reqWidth, reqDepth,
                        okW, okD, confining: b.on && okW && okD
                    };
                });

                const nPresent  = faceResults.filter(f => f.on).length;
                const nConfining = faceResults.filter(f => f.confining).length;
                const confPairX = faceResults[0].confining && faceResults[1].confining;
                const confPairY = faceResults[2].confining && faceResults[3].confining;

                let jointClass, jointCoef, jointTitle, jointClause;
                if (nConfining === 4) {
                    jointClass = 'ก'; jointCoef = 5.4;
                    jointTitle = 'ข้อต่อที่ได้รับการยึดรัดจากคานทั้ง 4 ด้าน';
                    jointClause = '5.2.7.5.3 (1) / สมการ 5.2-8';
                } else if (nConfining === 3 || (nConfining === 2 && (confPairX || confPairY))) {
                    jointClass = 'ข'; jointCoef = 4.0;
                    jointTitle = 'ข้อต่อที่ได้รับการยึดรัดจากคาน 3 ด้าน หรือคาน 2 ด้านที่อยู่ตรงข้ามกัน';
                    jointClause = '5.2.7.5.3 (2) / สมการ 5.2-9';
                } else {
                    jointClass = 'ค'; jointCoef = 3.2;
                    jointTitle = 'ข้อต่ออื่น ๆ';
                    jointClause = '5.2.7.5.3 (3) / สมการ 5.2-10';
                }

                // =====================================================================
                // 1. พื้นที่ต้านแรงเฉือนประสิทธิผล Aj [รูปที่ 5.2-7]
                //    ความกว้างประสิทธิผล bj = min( bc , b + h , b + 2*x1 )
                //    โดย b = ความกว้างคานที่ก่อให้เกิดแรงเฉือน, x1 = ระยะจากขอบคานถึงขอบเสา (ด้านที่น้อยกว่า)
                // =====================================================================
                const xBeamsOn = faceResults.filter(f => f.axis === 'X' && f.on);
                const bBeam = xBeamsOn.length ? Math.min(...xBeamsOn.map(f => f.w)) : 0;
                const ecc = Math.abs(beamEcc);
                const x1 = Math.max(0, (cPerp - bBeam) / 2 - ecc);
                const x2 = Math.max(0, (cPerp - bBeam) / 2 + ecc);
                const bjCandidates = { colLimit: cPerp, bPlusH: bBeam + hJoint, bPlus2x1: bBeam + 2 * x1 };
                const bjFig = bBeam > 0 ? Math.min(cPerp, bBeam + hJoint, bBeam + 2 * x1) : cPerp;
                const bjUsed = (ajMethod === 'fig' && bBeam > 0) ? bjFig : cPerp;
                const aj      = bjUsed * hJoint;   // cm2 (ที่ใช้จริง)
                const ajFull  = cPerp * hJoint;    // cm2 (แบบเดิม: เต็มหน้าตัดเสา)
                const ajFig   = bjFig * hJoint;    // cm2 (ตามรูปที่ 5.2-7)

                // =====================================================================
                // 2. แรงเฉือนที่เกิดขึ้นในข้อต่อ (Vj) [ข้อ 5.2.7.5.2 / รูปที่ 5.2-5]
                // =====================================================================
                const forceRebar1 = (as1 * fy) / 1000; // Ton
                const forceRebar2 = (as2 * fy) / 1000; // Ton

                const vjInt = forceRebar1 + forceRebar2 - vCol;         // คานเข้าบรรจบ 2 ด้านในทิศแรงเฉือน
                const maxForceRebar = Math.max(forceRebar1, forceRebar2);
                const vjExt = maxForceRebar - vCol;                     // คานเข้าบรรจบด้านเดียว

                // ตัดสินจาก "การมีคาน" ในทิศทางแรงเฉือน (ไม่ใช่จากเกณฑ์ยึดรัด)
                const isInterior = faceResults[0].on && faceResults[1].on;
                const vjUsed = isInterior ? vjInt : vjExt;

                // =====================================================================
                // 3. กำลังรับแรงเฉือนระบุ (Vn) [หน่วยเมตริก: ksc, cm -> Ton]
                // =====================================================================
                const sqrtFc = Math.sqrt(fc);
                const vnOf = (coef) => (coef * sqrtFc * aj) / 1000;
                const vn4Sides = vnOf(5.4);
                const vn3Sides = vnOf(4.0);
                const vnOther  = vnOf(3.2);
                const vnUsed   = vnOf(jointCoef);
                const phiVnUsed = phi * vnUsed;
                const dcr = phiVnUsed > 0 ? vjUsed / phiVnUsed : 0;
                const jointPass = vjUsed <= phiVnUsed;

                // =====================================================================
                // 4. เหล็กปลอกขั้นต่ำ (Av,min) [ข้อ 5.2.7.4.4 / สมการ 5.2-6]
                //    Av = 3.5 * c1 * s / fy  (หน่วยเมตริก)
                // =====================================================================
                const c1 = c1Mode === 'h' ? hJoint : (c1Mode === 'b' ? cPerp : Math.max(hJoint, cPerp));
                const avMin = (3.5 * c1 * tieSpacing) / fyt; // cm2
                const areaOneTie = Math.PI * Math.pow((tieSize / 10) / 2, 2); // cm2
                const avProv = tieLegs * areaOneTie; // cm2
                const tieDepthReq = maxBeamDepth;   // ต้องเสริมปลอกลึกไม่น้อยกว่าคานที่ลึกที่สุด

                // --- ข้อความเตือน ---
                const warnings = [];
                if (nPresent === 0) warnings.push('ยังไม่ได้ระบุคานที่เข้ามาบรรจบที่ข้อต่อ');
                if (xBeamsOn.length === 0) warnings.push('ไม่มีคานในทิศทางแรงเฉือนที่พิจารณา (แกน X) — ตรวจสอบการกำหนดทิศทาง');
                if (bBeam > cPerp) warnings.push('ความกว้างคานมากกว่าความกว้างเสา — จำกัด bj ไม่เกินความกว้างเสา');
                if (ajMethod === 'full' && bjFig < cPerp - TOL) warnings.push('เลือกใช้ Aj = bc × h ทั้งที่รูปที่ 5.2-7 ให้ bj น้อยกว่าความกว้างเสา (ไม่ปลอดภัย)');

                return {
                    phi, as1, as2, forceRebar1, forceRebar2, maxForceRebar,
                    // จำแนกข้อต่อ
                    faceResults, nPresent, nConfining, confPairX, confPairY,
                    maxBeamDepth, reqDepth, jointClass, jointCoef, jointTitle, jointClause,
                    // Aj
                    hJoint, cPerp, bBeam, ecc, x1, x2, bjCandidates, bjFig, bjUsed, aj, ajFull, ajFig,
                    // Vj / Vn
                    isInterior, vjInt, vjExt, vjUsed,
                    vn4Sides, vn3Sides, vnOther, vnUsed, phiVnUsed, dcr, jointPass,
                    phiVn4: phi * vn4Sides, phiVn3: phi * vn3Sides, phiVnOther: phi * vnOther,
                    // เหล็กปลอก
                    c1, avMin, avProv, tieDepthReq,
                    warnings
                };
            }, [inputs]);

            // --- Handlers ---
            const handleInputChange = (e) => {
                const { name, value, type } = e.target;
                setInputs(prev => ({ 
                    ...prev, 
                    [name]: type === 'text' ? value : (parseFloat(value) || 0) 
                }));
            };

            const updateBeam = (key, field, value) => {
                setInputs(prev => ({
                    ...prev,
                    beams: {
                        ...prev.beams,
                        [key]: {
                            ...prev.beams[key],
                            [field]: field === 'on' ? value : (parseFloat(value) || 0)
                        }
                    }
                }));
            };

            const addRebarLayer = (type) => {
                setInputs(prev => ({
                    ...prev,
                    [type]: [...prev[type], { id: Date.now(), count: 2, size: 12 }]
                }));
            };

            const removeRebarLayer = (type, id) => {
                setInputs(prev => ({
                    ...prev,
                    [type]: prev[type].filter(r => r.id !== id)
                }));
            };

            const updateRebar = (type, id, field, value) => {
                setInputs(prev => ({
                    ...prev,
                    [type]: prev[type].map(r => r.id === id ? { ...r, [field]: parseFloat(value) || 0 } : r)
                }));
            };

            // --- Sub-components ---
            const StatusBadge = ({ isPass }) => (
                <span className={`inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium ${isPass ? 'bg-green-100 text-green-800' : 'bg-red-100 text-red-800'} print:px-1.5 print:py-0.5`}>
                    {isPass ? 'ผ่าน (Pass)' : 'ไม่ผ่าน (Fail)'}
                </span>
            );

            // --- รูปด้านบน (Plan) ของข้อต่อ วาดตามสัดส่วนจริง ---
            const JointPlanView = () => {
                const r = results;
                const maxDim = Math.max(r.hJoint, r.cPerp, 1);
                const s = 95 / maxDim;               // px ต่อ cm
                const CX = 168, CY = 132;
                const hw = (r.hJoint * s) / 2;       // ครึ่งความลึกข้อต่อ (แนวนอน = แกน X)
                const hh = (r.cPerp * s) / 2;        // ครึ่งความกว้างเสา (แนวตั้ง = แกน Y)
                const stub = 52;
                const ey = (inputs.beamEcc || 0) * s;

                const colOf = (f) => f.confining ? '#059669' : '#d97706';
                const fillOf = (f) => f.confining ? '#d1fae5' : '#fef3c7';
                const F = { x1: r.faceResults[0], x2: r.faceResults[1], y1: r.faceResults[2], y2: r.faceResults[3] };

                return (
                    <svg viewBox="0 0 336 268" className="w-full max-w-md mx-auto">
                        <defs>
                            <pattern id="ajHatch" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
                                <line x1="0" y1="0" x2="0" y2="5" stroke="#1d4ed8" strokeWidth="1.2" opacity="0.55" />
                            </pattern>
                            <marker id="arw" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
                                <path d="M0,0 L6,3 L0,6 z" fill="#dc2626" />
                            </marker>
                        </defs>

                        {/* คานแกน X (ทิศทางแรงเฉือน) */}
                        {F.x1.on && <rect x={CX + hw} y={CY + ey - (F.x1.w * s) / 2} width={stub} height={F.x1.w * s} fill={fillOf(F.x1)} stroke={colOf(F.x1)} strokeWidth="1.6" />}
                        {F.x2.on && <rect x={CX - hw - stub} y={CY + ey - (F.x2.w * s) / 2} width={stub} height={F.x2.w * s} fill={fillOf(F.x2)} stroke={colOf(F.x2)} strokeWidth="1.6" />}
                        {/* คานแกน Y (คานขวาง) */}
                        {F.y1.on && <rect x={CX - (F.y1.w * s) / 2} y={CY - hh - stub} width={F.y1.w * s} height={stub} fill={fillOf(F.y1)} stroke={colOf(F.y1)} strokeWidth="1.6" />}
                        {F.y2.on && <rect x={CX - (F.y2.w * s) / 2} y={CY + hh} width={F.y2.w * s} height={stub} fill={fillOf(F.y2)} stroke={colOf(F.y2)} strokeWidth="1.6" />}

                        {/* หน้าตัดเสา */}
                        <rect x={CX - hw} y={CY - hh} width={hw * 2} height={hh * 2} fill="#f1f5f9" stroke="#334155" strokeWidth="2" />
