<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>โปรแกรมคำนวณกำลังในข้อต่อ (Beam-Column Joint)</title>
    <!-- เพิ่ม Favicon แบบฝังด้วย SVG -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23334155'/%3E%3Cpath stroke='%2360a5fa' stroke-linecap='round' stroke-linejoin='round' stroke-width='3' d='M8 12h16M8 20h16M12 8v16M20 8v16'/%3E%3C/svg%3E">
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & Babel -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap');
        body {
            font-family: 'Sarabun', sans-serif;
            background-color: #f3f4f6;
            color: #1f2937;
        }
        .math-font {
            font-family: 'Times New Roman', Times, serif;
            font-style: italic;
        }
        
        /* ตั้งค่ากระดาษสำหรับการพิมพ์ A4 */
        @page {
            size: A4;
            margin: 1.5cm; /* ใช้ margin ของ @page เพื่อไม่ให้เนื้อหาตกขอบ และให้ Browser คำนวณความกว้างได้ถูกต้อง */
        }
        @media print {
            body {
                background-color: #ffffff;
                -webkit-print-color-adjust: exact;
                print-color-adjust: exact;
                /* นำ padding ออกเพื่อป้องกันความกว้างทะลุ 100% */
                padding: 0; 
            }
            .shadow-sm, .shadow-md, .shadow-lg {
                box-shadow: none !important;
            }
            input, select {
                border-color: #d1d5db !important;
            }
            /* บังคับขึ้นหน้าใหม่เวลาพิมพ์ */
            .print\:break-before-page {
                page-break-before: always !important;
                break-before: page !important;
            }
            /* ป้องกันกล่องย่อยถูกตัดขาดกลางหน้า */
            .print\:break-inside-avoid {
                page-break-inside: avoid !important;
                break-inside: avoid !important;
            }
            /* ป้องกันการ overflow ของตาราง */
            .print\:overflow-visible {
                overflow: visible !important;
            }
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useMemo } = React;

        // --- SVG Icons Components ---
        const IconCheck = () => (
            <svg className="w-5 h-5 text-green-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M5 13l4 4L19 7"></path>
            </svg>
        );
        const IconCross = () => (
            <svg className="w-5 h-5 text-red-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M6 18L18 6M6 6l12 12"></path>
            </svg>
        );
        const IconJoint = () => (
            <svg className="w-8 h-8 text-blue-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 8h16M4 16h16M8 4v16M16 4v16"></path>
            </svg>
        );

        // --- เพิ่ม Icon สำหรับปุ่ม Print ---
        const IconPrinter = () => (
            <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M17 17h2a2 2 0 002-2v-4a2 2 0 00-2-2H5a2 2 0 00-2 2v4a2 2 0 002 2h2m2 4h6a2 2 0 002-2v-4a2 2 0 00-2-2H9a2 2 0 00-2 2v4a2 2 0 002 2zm8-12V5a2 2 0 00-2-2H9a2 2 0 00-2 2v4h10z"></path>
            </svg>
        );

        const App = () => {
            // --- 1. Global States (Inputs) ---
            const [inputs, setInputs] = useState({
                // วัสดุ
                fc: 240,       // ksc
                fy: 4000,      // ksc
                fyt: 2400,     // ksc (สำหรับเหล็กปลอก)
                
                // ขนาดหน้าตัด
                colWidth: 20,  // cm (b)
                colDepth: 20,  // cm (h)
                
                // แรงและเหล็กเสริม
                topRebars: [{ id: 1, count: 2, size: 12 }], // เหล็กบน (รองรับหลายชั้น)
                botRebars: [{ id: 2, count: 2, size: 12 }], // เหล็กล่าง (รองรับหลายชั้น)
                vCol: 0,      // Ton (แรงเฉือนในเสา)
                
                // เหล็กปลอกในข้อต่อ
                tieSize: 6,    // mm
                tieLegs: 2,    // จำนวนขา
                tieSpacing: 10 // cm
            });

            const [activeTab, setActiveTab] = useState('summary');

            // --- Calculations ---
            const results = useMemo(() => {
                const { fc, fy, fyt, colWidth, colDepth, topRebars, botRebars, vCol, tieSize, tieLegs, tieSpacing } = inputs;
                
                // ตัวคูณลดกำลัง (Phi) สำหรับแรงเฉือน
                const phi = 0.85; 

                // คำนวณพื้นที่หน้าตัดเหล็ก (As1, As2) จากทุกชั้น
                const calculateArea = (rebars) => rebars.reduce((sum, r) => sum + r.count * (Math.PI * Math.pow((r.size / 10) / 2, 2)), 0);
                const as1 = calculateArea(topRebars); // cm2
                const as2 = calculateArea(botRebars); // cm2

                // 1. แรงเฉือนที่เกิดขึ้นในข้อต่อ (Vj)
                const forceRebar1 = (as1 * fy) / 1000; // Ton
                const forceRebar2 = (as2 * fy) / 1000; // Ton
                
                // 1.1 แรงเฉือนแบบข้อต่อภายใน (Continuous Joint)
                const vjInt = forceRebar1 + forceRebar2 - vCol; // Ton
                
                // 1.2 แรงเฉือนแบบข้อต่อภายนอก (Corner/Roof) เลือกใช้ As ที่มากที่สุด
                const maxForceRebar = Math.max(forceRebar1, forceRebar2);
                const vjExt = maxForceRebar - vCol; // Ton

                // 2. พื้นที่หน้าตัดข้อต่อ (Aj)
                const aj = colWidth * colDepth; // cm2

                // 3. กำลังรับแรงเฉือนระบุ (Vn) ตามรูปแบบการยึดรั้ง [หน่วย Metric: ksc -> Ton]
                const sqrtFc = Math.sqrt(fc);
                const vn4Sides = (5.4 * sqrtFc * aj) / 1000;
                const vn3Sides = (4.0 * sqrtFc * aj) / 1000; 
                const vnOther =  (3.2 * sqrtFc * aj) / 1000;

                // 4. เหล็กปลอกขั้นต่ำ (Av,min)
                const bw = Math.min(colWidth, colDepth);
                const avMin = (3.5 * bw * tieSpacing) / fyt; // cm2
                
                // พื้นที่เหล็กปลอกที่ใส่จริง (Av,provided)
                const areaOneTie = Math.PI * Math.pow((tieSize / 10) / 2, 2); // cm2
                const avProv = tieLegs * areaOneTie; // cm2

                return { 
                    phi, vjInt, vjExt, maxForceRebar, aj, 
                    vn4Sides, vn3Sides, vnOther, 
                    phiVn4: phi * vn4Sides, phiVn3: phi * vn3Sides, phiVnOther: phi * vnOther,
                    avMin, avProv, forceRebar1, forceRebar2,
                    as1, as2, bw
                };
            }, [inputs]);

            // --- Handlers ---
            const handleInputChange = (e) => {
                const { name, value } = e.target;
                setInputs(prev => ({ ...prev, [name]: parseFloat(value) || 0 }));
            };

            const addRebarLayer = (type) => {
                setInputs(prev => ({
                    ...prev,
                    [type]: [...prev[type], { id: Date.now(), count: 2, size: 12 }]
                }));
            };

            const removeRebarLayer = (type, id) => {
                setInputs(prev => ({
                    ...prev,
                    [type]: prev[type].filter(r => r.id !== id)
                }));
            };

            const updateRebar = (type, id, field, value) => {
                setInputs(prev => ({
                    ...prev,
                    [type]: prev[type].map(r => r.id === id ? { ...r, [field]: parseFloat(value) || 0 } : r)
                }));
            };

            // --- Sub-components ---
            const StatusBadge = ({ isPass }) => (
                <span className={`inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium ${isPass ? 'bg-green-100 text-green-800' : 'bg-red-100 text-red-800'}`}>
                    {isPass ? 'ผ่าน (Pass)' : 'ไม่ผ่าน (Fail)'}
                </span>
            );

            return (
                <div className="min-h-screen pb-12 print:pb-0 print:bg-white">
                    {/* Header สำหรับหน้าจอ UI (ซ่อนตอนพิมพ์) */}
                    <header className="bg-slate-800 text-white shadow-lg print:hidden">
                        <div className="max-w-5xl mx-auto px-4 py-5 flex items-center justify-between">
                            <div className="flex items-center gap-4">
                                <div className="p-2 bg-slate-700 rounded-lg print:bg-transparent print:text-slate-800 print:p-0">
                                    <IconJoint />
                                </div>
                                <div>
                                    <h1 className="text-2xl font-bold">มยผ. 1301/1302-61 (IMRF) Joint</h1>
                                    <p className="text-slate-300 text-sm print:text-slate-600">โปรแกรมคำนวณกำลังรับแรงเฉือนในข้อต่อเสา-คาน</p>
                                </div>
                            </div>
                            
                            <button 
                                onClick={() => window.print()} 
                                className="print:hidden bg-blue-500 hover:bg-blue-600 text-white px-4 py-2 rounded-lg font-medium flex items-center gap-2 transition-colors shadow-sm cursor-pointer"
                            >
                                <IconPrinter />
                                พิมพ์รายงาน (A4)
                            </button>
                        </div>
                    </header>

                    {/* Header สำหรับการพิมพ์ (รายการคำนวณ) */}
                    <div className="hidden print:block text-center border-b-2 border-slate-800 pb-4 pt-4 max-w-5xl w-full mx-auto print:mb-6 print:break-inside-avoid">
                        <h1 className="text-2xl print:text-xl font-bold mb-2 whitespace-nowrap">รายการคำนวณกำลังรับแรงเฉือนในข้อต่อเสา-คาน (Beam-Column Joint)</h1>
                        <h2 className="text-lg print:text-base text-slate-700 whitespace-nowrap">อ้างอิงมาตรฐานการออกแบบอาคารต้านทานการสั่นสะเทือนของแผ่นดินไหว (มยผ. 1301/1302-61)</h2>
                    </div>

                    <main className="max-w-5xl w-full mx-auto px-4 mt-6 print:mt-0 print:px-0">
                        {/* --- Section 1: Global Inputs (อยู่หน้า 1) --- */}
                        <div className="bg-white rounded-xl shadow-md border border-gray-200 overflow-hidden mb-6 print:shadow-none print:border-none print:mb-6 print:break-inside-avoid">
                            <div className="bg-blue-50 border-b border-blue-100 px-6 py-3 print:bg-transparent print:border-b-2 print:border-slate-800 print:px-0">
                                <h2 className="font-bold text-blue-800 flex items-center gap-2 print:text-slate-800">
                                    <svg className="w-5 h-5 print:hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"></path></svg>
                                    ข้อมูลนำเข้า (Global Inputs)
                                </h2>
                            </div>
                            {/* ปรับ Grid ตอนพิมพ์เป็น 2 คอลัมน์เพื่อไม่ให้แคบเกินไป */}
                            <div className="p-6 grid grid-cols-1 md:grid-cols-4 print:grid-cols-2 gap-6 print:px-0 print:py-4 print:gap-y-8 print:border-b print:border-gray-200 print:pb-8">
                                {/* Column 1: Material */}
                                <div className="space-y-4">
                                    <h3 className="text-sm font-semibold text-gray-500 uppercase border-b pb-1">วัสดุ (Material)</h3>
                                    <div>
                                        <label className="block text-xs text-gray-600 mb-1">กำลังอัดคอนกรีต, f'<sub>c</sub> (ksc)</label>
                                        <input type="number" name="fc" value={inputs.fc} onChange={handleInputChange} className="w-full px-3 py-2 border rounded-md focus:ring-blue-500 focus:border-blue-500 outline-none transition" />
                                    </div>
                                    <div>
                                        <label className="block text-xs text-gray-600 mb-1">กำลังครากเหล็กคาน, f<sub>y</sub> (ksc)</label>
                                        <input type="number" name="fy" value={inputs.fy} onChange={handleInputChange} className="w-full px-3 py-2 border rounded-md focus:ring-blue-500 focus:border-blue-500 outline-none transition" />
                                    </div>
                                </div>

                                {/* Column 2: Geometry */}
                                <div className="space-y-4">
                                    <h3 className="text-sm font-semibold text-gray-500 uppercase border-b pb-1">ขนาดเสา (Column Size)</h3>
                                    <div>
                                        <label className="block text-xs text-gray-600 mb-1">ความกว้าง, b (cm)</label>
                                        <input type="number" name="colWidth" value={inputs.colWidth} onChange={handleInputChange} className="w-full px-3 py-2 border rounded-md focus:ring-blue-500 focus:border-blue-500 outline-none transition" />
                                    </div>
                                    <div>
                                        <label className="block text-xs text-gray-600 mb-1">ความลึก, h (cm)</label>
                                        <input type="number" name="colDepth" value={inputs.colDepth} onChange={handleInputChange} className="w-full px-3 py-2 border rounded-md focus:ring-blue-500 focus:border-blue-500 outline-none transition" />
                                    </div>
                                </div>

                                {/* Column 3: Forces & Rebars */}
                                <div className="space-y-4">
                                    <h3 className="text-sm font-semibold text-gray-500 uppercase border-b pb-1">แรงและเหล็กคาน</h3>
                                    
                                    <div className="bg-gray-50 p-3 rounded-md border border-gray-200">
                                        <div className="flex justify-between items-center mb-2">
                                            <label className="block text-xs font-bold text-gray-700">เหล็กบน (Top Rebar)</label>
                                            <button type="button" onClick={() => addRebarLayer('topRebars')} className="text-[10px] bg-blue-100 text-blue-700 px-2 py-1 rounded hover:bg-blue-200 print:hidden flex items-center transition-colors">+ เพิ่มชั้น</button>
                                        </div>
                                        {inputs.topRebars.map((rebar, index) => (
                                            <div key={rebar.id} className="flex gap-2 mb-2 items-end">
                                                <div className="flex-1">
                                                    {index === 0 && <label className="block text-[10px] text-gray-500 mb-1">จำนวน (เส้น)</label>}
                                                    <input type="number" value={rebar.count} onChange={(e) => updateRebar('topRebars', rebar.id, 'count', e.target.value)} min="1" className="w-full px-2 py-1.5 text-sm border rounded-md focus:ring-blue-500 focus:border-blue-500 outline-none transition" />
                                                </div>
                                                <div className="flex-1">
                                                    {index === 0 && <label className="block text-[10px] text-gray-500 mb-1">ขนาด</label>}
                                                    <select value={rebar.size} onChange={(e) => updateRebar('topRebars', rebar.id, 'size', e.target.value)} className="w-full px-2 py-1.5 text-sm border rounded-md focus:ring-blue-500 focus:border-blue-500 outline-none transition">
                                                        <option value="12">DB12</option>
                                                        <option value="16">DB16</option>
                                                        <option value="20">DB20</option>
                                                        <option value="25">DB25</option>
                                                        <option value="28">DB28</option>
                                                        <option value="32">DB32</option>
                                                    </select>
                                                </div>
                                                {inputs.topRebars.length > 1 && (
                                                    <button type="button" onClick={() => removeRebarLayer('topRebars', rebar.id)} className="mb-0.5 p-1.5 bg-red-100 text-red-600 rounded-md hover:bg-red-200 print:hidden transition-colors" title="ลบชั้นนี้">
                                                        <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                                                    </button>
                                                )}
                                            </div>
                                        ))}
                                        <div className="text-[12px] text-right text-blue-700 font-mono bg-blue-100/50 p-1.5 rounded border border-blue-100 print:bg-transparent print:border-none print:p-0">
                                            A<sub>s1</sub> = {results.as1.toFixed(2)} cm&sup2;
                                        </div>
                                    </div>

                                    <div className="bg-gray-50 p-3 rounded-md border border-gray-200">
                                        <div className="flex justify-between items-center mb-2">
                                            <label className="block text-xs font-bold text-gray-700">เหล็กล่าง (Bottom Rebar)</label>
                                            <button type="button" onClick={() => addRebarLayer('botRebars')} className="text-[10px] bg-blue-100 text-blue-700 px-2 py-1 rounded hover:bg-blue-200 print:hidden flex items-center transition-colors">+ เพิ่มชั้น</button>
                                        </div>
                                        {inputs.botRebars.map((rebar, index) => (
                                            <div key={rebar.id} className="flex gap-2 mb-2 items-end">
                                                <div className="flex-1">
                                                    {index === 0 && <label className="block text-[10px] text-gray-500 mb-1">จำนวน (เส้น)</label>}
                                                    <input type="number" value={rebar.count} onChange={(e) => updateRebar('botRebars', rebar.id, 'count', e.target.value)} min="1" className="w-full px-2 py-1.5 text-sm border rounded-md focus:ring-blue-500 focus:border-blue-500 outline-none transition" />
                                                </div>
                                                <div className="flex-1">
                                                    {index === 0 && <label className="block text-[10px] text-gray-500 mb-1">ขนาด</label>}
                                                    <select value={rebar.size} onChange={(e) => updateRebar('botRebars', rebar.id, 'size', e.target.value)} className="w-full px-2 py-1.5 text-sm border rounded-md focus:ring-blue-500 focus:border-blue-500 outline-none transition">
                                                        <option value="12">DB12</option>
                                                        <option value="16">DB16</option>
                                                        <option value="20">DB20</option>
                                                        <option value="25">DB25</option>
                                                        <option value="28">DB28</option>
                                                        <option value="32">DB32</option>
                                                    </select>
                                                </div>
                                                {inputs.botRebars.length > 1 && (
                                                    <button type="button" onClick={() => removeRebarLayer('botRebars', rebar.id)} className="mb-0.5 p-1.5 bg-red-100 text-red-600 rounded-md hover:bg-red-200 print:hidden transition-colors" title="ลบชั้นนี้">
                                                        <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                                                    </button>
                                                )}
                                            </div>
                                        ))}
                                        <div className="text-[12px] text-right text-blue-700 font-mono bg-blue-100/50 p-1.5 rounded border border-blue-100 print:bg-transparent print:border-none print:p-0">
                                            A<sub>s2</sub> = {results.as2.toFixed(2)} cm&sup2;
                                        </div>
                                    </div>

                                    <div>
                                        <label className="block text-xs text-gray-600 mb-1 mt-3">แรงเฉือนเสา, V<sub>col</sub> (Ton)</label>
                                        <input type="number" name="vCol" value={inputs.vCol} onChange={handleInputChange} className="w-full px-3 py-2 border rounded-md focus:ring-blue-500 focus:border-blue-500 outline-none transition" />
                                    </div>
                                </div>

                                {/* Column 4: Ties */}
                                <div className="space-y-4">
                                    <h3 className="text-sm font-semibold text-gray-500 uppercase border-b pb-1">เหล็กปลอก (Transverse)</h3>
                                    <div>
                                        <label className="block text-xs text-gray-600 mb-1">f<sub>yt</sub> เหล็กปลอก (ksc)</label>
                                        <input type="number" name="fyt" value={inputs.fyt} onChange={handleInputChange} className="w-full px-3 py-2 border rounded-md focus:ring-blue-500 focus:border-blue-500 outline-none transition" />
                                    </div>
                                    <div className="grid grid-cols-2 gap-2">
                                        <div>
                                            <label className="block text-xs text-gray-600 mb-1">ขนาด (mm)</label>
                                            <input type="number" name="tieSize" value={inputs.tieSize} onChange={handleInputChange} className="w-full px-3 py-2 border rounded-md focus:ring-blue-500 focus:border-blue-500 outline-none transition" />
                                        </div>
                                        <div>
                                            <label className="block text-xs text-gray-600 mb-1">จำนวนขา</label>
                                            <input type="number" name="tieLegs" value={inputs.tieLegs} onChange={handleInputChange} className="w-full px-3 py-2 border rounded-md focus:ring-blue-500 focus:border-blue-500 outline-none transition" />
                                        </div>
                                    </div>
                                    <div>
                                        <label className="block text-xs text-gray-600 mb-1">ระยะเรียง, s (cm)</label>
                                        <input type="number" name="tieSpacing" value={inputs.tieSpacing} onChange={handleInputChange} className="w-full px-3 py-2 border rounded-md focus:ring-blue-500 focus:border-blue-500 outline-none transition" />
                                    </div>
                                </div>
                            </div>
                        </div>

                                                <div className="flex items-start gap-2"><span className="math-font font-bold w-12 shrink-0">f<sub>y</sub></span><span>= กำลังครากของเหล็กเสริมหลักในคาน (ksc)</span></div>
                                                <div className="flex items-start gap-2"><span className="math-font font-bold w-12 shrink-0">f<sub>yt</sub></span><span>= กำลังครากของเหล็กปลอก (ksc)</span></div>
                                                <div className="flex items-start gap-2"><span className="math-font font-bold w-12 shrink-0">b, h</span><span>= ความกว้าง และความลึกของเสา (cm)</span></div>
                                                <div className="flex items-start gap-2"><span className="math-font font-bold w-12 shrink-0">A<sub>s1</sub></span><span>= พื้นที่หน้าตัดรวมเหล็กเสริมบน (cm&sup2;)</span></div>
                                                <div className="flex items-start gap-2"><span className="math-font font-bold w-12 shrink-0">A<sub>s2</sub></span><span>= พื้นที่หน้าตัดรวมเหล็กเสริมล่าง (cm&sup2;)</span></div>
                                                <div className="flex items-start gap-2"><span className="math-font font-bold w-12 shrink-0">V<sub>col</sub></span><span>= แรงเฉือนในเสาที่ระดับข้อต่อ (Ton)</span></div>
                                                <div className="flex items-start gap-2"><span className="math-font font-bold w-12 shrink-0">A<sub>j</sub></span><span>= พื้นที่ต้านแรงเฉือนประสิทธิผลของข้อต่อ (cm&sup2;)</span></div>
                                                <div className="flex items-start gap-2"><span className="math-font font-bold w-12 shrink-0">V<sub>j</sub></span><span>= แรงเฉือนที่เกิดขึ้นในข้อต่อ (Ton)</span></div>
                                                <div className="flex items-start gap-2"><span className="math-font font-bold w-12 shrink-0">V<sub>n</sub></span><span>= กำลังต้านแรงเฉือนระบุของข้อต่อ (Ton)</span></div>
                                                <div className="flex items-start gap-2"><span className="math-font font-bold w-12 shrink-0">&phi;</span><span>= ตัวคูณลดกำลังของข้อต่อ (0.85)</span></div>
                                                <div className="flex items-start gap-2"><span className="math-font font-bold w-12 shrink-0">A<sub>v,min</sub></span><span>= ปริมาณเหล็กปลอกขั้นต่ำ (cm&sup2;)</span></div>
                                                <div className="flex items-start gap-2"><span className="math-font font-bold w-12 shrink-0">s</span><span>= ระยะเรียงของเหล็กปลอก (cm)</span></div>
                                            </div>
                                        </div>

                                        {/* Section: Joint Types Diagram */}
                                        <div className="print:break-inside-avoid">
                                            <h3 className="text-lg font-bold text-gray-800 mb-4 border-b pb-2 print:border-slate-800">รูปแบบข้อต่อ (Joint Types) <span className="text-sm font-normal text-blue-600">[อ้างอิง มยผ. รูปที่ 5.2-6]</span></h3>
                                            <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                                                {/* Type 1: 4 Sides */}
                                                <div className="border border-gray-200 rounded-lg p-4 flex flex-col items-center text-center bg-gray-50 print:bg-transparent print:border-gray-300">
                                                    <div className="h-32 flex items-center justify-center mb-4">
                                                        <svg viewBox="0 0 100 100" className="w-24 h-24">
                                                            <defs>
                                                                <pattern id="grid1" width="4" height="4" patternUnits="userSpaceOnUse">
                                                                    <circle cx="2" cy="2" r="0.75" fill="#1d4ed8" opacity="0.6"/>
                                                                </pattern>
                                                            </defs>
                                                            <rect x="42" y="10" width="16" height="30" fill="#e2e8f0" stroke="#64748b" strokeWidth="2"/>
                                                            <rect x="42" y="60" width="16" height="30" fill="#e2e8f0" stroke="#64748b" strokeWidth="2"/>
                                                            <rect x="10" y="42" width="30" height="16" fill="#e2e8f0" stroke="#64748b" strokeWidth="2"/>
                                                            <rect x="60" y="42" width="30" height="16" fill="#e2e8f0" stroke="#64748b" strokeWidth="2"/>
                                                            <rect x="36" y="36" width="28" height="28" fill="url(#grid1)" stroke="#1d4ed8" strokeWidth="2" />
                                                        </svg>
                                                    </div>
                                                    <p className="font-bold text-sm text-gray-800">(ก) ข้อต่อยึดรั้ง 4 ด้าน</p>
                                                    <p className="text-xs text-gray-500 mt-1">คานเข้าบรรจบครบ 4 ด้าน<br/>(Interior Joint)</p>
                                                    <p className="math-font text-blue-700 font-bold mt-2">V<sub>n</sub> = 5.4 &radic;f'<sub>c</sub> A<sub>j</sub></p>
                                                </div>

                                                {/* Type 2: 3 Sides / 2 Opposite */}
                                                <div className="border border-gray-200 rounded-lg p-4 flex flex-col items-center text-center bg-gray-50 print:bg-transparent print:border-gray-300">
                                                    <div className="h-32 flex items-center justify-center mb-4">
                                                        <svg viewBox="0 0 100 100" className="w-24 h-24">
                                                            <defs>
                                                                <pattern id="grid2" width="4" height="4" patternUnits="userSpaceOnUse">
                                                                    <circle cx="2" cy="2" r="0.75" fill="#1d4ed8" opacity="0.6"/>
                                                                </pattern>
                                                            </defs>
                                                            <rect x="42" y="10" width="16" height="30" fill="#e2e8f0" stroke="#64748b" strokeWidth="2"/>
                                                            <rect x="10" y="42" width="30" height="16" fill="#e2e8f0" stroke="#64748b" strokeWidth="2"/>
                                                            <rect x="60" y="42" width="30" height="16" fill="#e2e8f0" stroke="#64748b" strokeWidth="2"/>
                                                            <rect x="36" y="36" width="28" height="28" fill="url(#grid2)" stroke="#1d4ed8" strokeWidth="2" />
                                                        </svg>
                                                    </div>
                                                    <p className="font-bold text-sm text-gray-800">(ข) ข้อต่อยึดรั้ง 2-3 ด้าน</p>
                                                    <p className="text-xs text-gray-500 mt-1">คานเข้าบรรจบ 3 ด้าน หรือ 2 ด้านตรงข้ามกัน<br/>(Exterior Joint)</p>
                                                    <p className="math-font text-blue-700 font-bold mt-2">V<sub>n</sub> = 4.0 &radic;f'<sub>c</sub> A<sub>j</sub></p>
                                                </div>

                                                {/* Type 3: Other */}
                                                <div className="border border-gray-200 rounded-lg p-4 flex flex-col items-center text-center bg-gray-50 print:bg-transparent print:border-gray-300">
                                                    <div className="h-32 flex items-center justify-center mb-4">
                                                        <svg viewBox="0 0 100 100" className="w-24 h-24">
                                                            <defs>
                                                                <pattern id="grid3" width="4" height="4" patternUnits="userSpaceOnUse">
                                                                    <circle cx="2" cy="2" r="0.75" fill="#1d4ed8" opacity="0.6"/>
                                                                </pattern>
                                                            </defs>
                                                            <rect x="42" y="10" width="16" height="30" fill="#e2e8f0" stroke="#64748b" strokeWidth="2"/>
                                                            <rect x="60" y="42" width="30" height="16" fill="#e2e8f0" stroke="#64748b" strokeWidth="2"/>
                                                            <rect x="36" y="36" width="28" height="28" fill="url(#grid3)" stroke="#1d4ed8" strokeWidth="2" />
                                                        </svg>
                                                    </div>
                                                    <p className="font-bold text-sm text-gray-800">(ค) ข้อต่ออื่นๆ</p>
                                                    <p className="text-xs text-gray-500 mt-1">คานเข้าบรรจบเป็นมุมฉาก หรือกรณีอื่นๆ<br/>(Corner / Roof Joint)</p>
                                                    <p className="math-font text-blue-700 font-bold mt-2">V<sub>n</sub> = 3.2 &radic;f'<sub>c</sub> A<sub>j</sub></p>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                                
                            </div>
                        </div>
                    </main>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
